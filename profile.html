<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Huy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      max-width: 460px;
      width: 100%;
      padding: 40px 36px 36px;
      color: #fff;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      animation: rise .6s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(.96); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.25);
      background: linear-gradient(135deg,#667eea,#764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      margin: 0 auto;
    }
    .status-dot {
      position: absolute; bottom: 6px; right: 6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #4ade80;
      border: 3px solid #1a1535;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}
      50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
    }

    /* ── Name / Bio ── */
    .name {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .handle {
      font-size: 14px; color: rgba(255,255,255,.5);
      margin: 4px 0 12px;
    }
    .bio {
      font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.75);
      max-width: 340px; margin: 0 auto 24px;
    }

    /* ── Stats ── */
    .stats {
      display: flex; gap: 1px;
      background: rgba(255,255,255,.08);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 24px;
    }
    .stat {
      flex: 1; padding: 14px 8px;
      background: rgba(255,255,255,.03);
      transition: background .2s;
    }
    .stat:hover { background: rgba(255,255,255,.1); }
    .stat-num { font-size: 20px; font-weight: 800; color: #fff; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

    /* ── Skills ── */
    .skills {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 28px;
    }
    .skill {
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      border: 1.5px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      cursor: default;
      transition: all .2s;
    }
    .skill:hover {
      border-color: rgba(167,139,250,.7);
      background: rgba(167,139,250,.15);
      color: #c4b5fd;
    }

    /* ── Buttons ── */
    .actions { display: flex; gap: 12px; margin-bottom: 28px; }
    .btn {
      flex: 1; padding: 13px;
      border-radius: 14px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700;
      transition: transform .15s, opacity .2s;
      text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:hover { transform: translateY(-2px); opacity: .9; }
    .btn-primary {
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      color: #fff; box-shadow: 0 4px 18px rgba(124,58,237,.45);
    }
    .btn-outline {
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.85);
    }

    /* ── Social Links ── */
    .socials { display: flex; justify-content: center; gap: 16px; }
    .social-link {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1.5px solid rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.7); font-size: 18px;
      text-decoration: none; transition: all .2s;
    }
    .social-link:hover {
      background: rgba(255,255,255,.18);
      color: #fff; transform: translateY(-3px);
      border-color: rgba(255,255,255,.35);
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,.08);
      margin: 24px 0;
    }

    /* ── Location ── */
    .location {
      font-size: 13px; color: rgba(255,255,255,.45);
      margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
  </style>
</head>
