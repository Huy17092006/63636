<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter - 2D Bắn Nhau</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #gameContainer {
    position: relative;
    width: 480px;
    height: 700px;
  }
  canvas {
    display: block;
    border: 2px solid #0ff;
    box-shadow: 0 0 30px #0ff4, 0 0 60px #0ff2;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: #0ff;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 0 8px #0ff;
  }
  #healthBar {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .heart { font-size: 16px; }
  #scoreDisplay { font-size: 16px; letter-spacing: 2px; }
  #levelDisplay { font-size: 14px; color: #f0f; text-shadow: 0 0 8px #f0f; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    background: rgba(0,0,0,0.85);
  }
  #overlay h1 {
    font-size: 42px;
    letter-spacing: 4px;
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    margin-bottom: 10px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  #overlay .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  #overlay .info {
    font-size: 13px;
    color: #aaa;
    line-height: 2;
    margin-bottom: 30px;
    border: 1px solid #333;
    padding: 16px 24px;
    border-radius: 8px;
    background: rgba(0,255,255,0.05);
  }
  #overlay .info span { color: #0ff; }
  #startBtn {
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    letter-spacing: 3px;
    padding: 12px 40px;
    cursor: pointer;
    text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 20px #0ff4;
    transition: all 0.2s;
    animation: pulse 1.5s ease-in-out infinite;
  }
  #startBtn:hover {
    background: #0ff2;
    box-shadow: 0 0 40px #0ff8;
    transform: scale(1.05);
  }
  #finalScore {
    font-size: 22px;
    color: #ff0;
    text-shadow: 0 0 10px #ff0;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  #gameOverTitle {
    font-size: 48px;
    color: #f00;
    text-shadow: 0 0 20px #f00, 0 0 40px #f00;
    margin-bottom: 10px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  #bossBar {
    position: absolute;
    bottom: 12px;
    left: 16px;
    right: 16px;
    display: none;
    pointer-events: none;
  }
  #bossLabel {
    color: #f0a;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 0 8px #f0a;
    margin-bottom: 4px;
    text-align: center;
    letter-spacing: 2px;
  }
  #bossBarBg {
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #f0a4;
  }
  #bossBarFill {
    height: 100%;
    background: linear-gradient(90deg, #f00, #f0a);
    border-radius: 4px;
    transition: width 0.1s;
    box-shadow: 0 0 8px #f0a;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="480" height="700"></canvas>
  <div id="ui">
    <div id="healthBar"></div>
    <div id="levelDisplay">LEVEL 1</div>
    <div id="scoreDisplay">SCORE: 0</div>
  </div>
  <div id="bossBar">
    <div id="bossLabel">⚠ BOSS ⚠</div>
    <div id="bossBarBg"><div id="bossBarFill" style="width:100%"></div></div>
  </div>
  <div id="overlay">
    <h1>SPACE BLASTER</h1>
    <div class="subtitle">2D SHOOTER GAME</div>
    <div class="info">
      <span>W / ↑</span> — Tiến lên<br>
      <span>S / ↓</span> — Lùi xuống<br>
      <span>A / ←</span> — Sang trái<br>
      <span>D / →</span> — Sang phải<br>
      <span>SPACE</span> — Bắn đạn<br>
      <span>E</span> — Phóng tên lửa (giới hạn)
    </div>
    <button id="startBtn">[ BẮT ĐẦU ]</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const healthBar = document.getElementById('healthBar');
const scoreDisplay = document.getElementById('scoreDisplay');
const levelDisplay = document.getElementById('levelDisplay');
const bossBarEl = document.getElementById('bossBar');
const bossBarFill = document.getElementById('bossBarFill');

// ── Game State ──────────────────────────────────────────────────────────────
const GS = { MENU: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
let state = GS.MENU;
let score = 0, level = 1, frameCount = 0;
let animId;

// ── Keys ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

// ── Stars Background ────────────────────────────────────────────────────────
const stars = Array.from({length: 150}, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 1.5 + 0.3,
  bright: Math.random()
}));

function drawStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    const alpha = 0.4 + s.bright * 0.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,220,255,${alpha})`;
    ctx.fill();
  });
}

// ── Particles ───────────────────────────────────────────────────────────────
let particles = [];
function spawnParticles(x, y, count, color, speed = 3) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + 0.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: Math.random() * 0.04 + 0.02,
      r: Math.random() * 3 + 1,
      color
    });
  }
}
function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) return false;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
    return true;
  });
}

// ── Player ──────────────────────────────────────────────────────────────────
const player = {
  x: W / 2, y: H - 100,
  w: 36, h: 48,
  speed: 5,
  hp: 3, maxHp: 3,
  missiles: 3, maxMissiles: 3,
  shootCd: 0, shootRate: 10,
  invincible: 0,
  shield: false, shieldTimer: 0,
  powerLevel: 0, powerTimer: 0,
  trail: []
};

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(frameCount / 5) % 2 === 0) return;

  // engine trail
  p.trail.push({ x: p.x, y: p.y + p.h / 2, life: 1 });
  if (p.trail.length > 12) p.trail.shift();
  p.trail.forEach((t, i) => {
    t.life -= 0.08;
    const a = t.life * 0.6;
    const r = 4 * t.life;
    ctx.beginPath();
    ctx.arc(t.x, t.y + (p.trail.length - i) * 1.5, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,180,255,${a})`;
    ctx.fill();
  });

  // shield glow
  if (p.shield) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,255,255,${0.4 + Math.sin(frameCount * 0.1) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = '#0ff';
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ship body
  ctx.save();
  ctx.translate(p.x, p.y);

  // main body
  ctx.beginPath();
  ctx.moveTo(0, -p.h / 2);
  ctx.lineTo(-p.w / 2, p.h / 2);
  ctx.lineTo(-p.w / 4, p.h / 4);
  ctx.lineTo(0, p.h / 3);
  ctx.lineTo(p.w / 4, p.h / 4);
  ctx.lineTo(p.w / 2, p.h / 2);
  ctx.closePath();
  ctx.fillStyle = '#0af';
  ctx.fill();
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // cockpit
  ctx.beginPath();
  ctx.ellipse(0, -p.h / 6, p.w / 6, p.h / 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#00ffff88';
  ctx.fill();
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 1;
  ctx.stroke();

  // wings glow
  if (p.powerLevel > 0) {
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-p.w / 2, p.h / 2);
    ctx.lineTo(-p.w / 3, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.w / 2, p.h / 2);
    ctx.lineTo(p.w / 3, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ── Bullets ─────────────────────────────────────────────────────────────────
let bullets = [];
let enemyBullets = [];

function shootPlayer() {
  const p = player;
  const spread = p.powerLevel;
  if (spread === 0) {
    bullets.push({ x: p.x, y: p.y - p.h / 2, vx: 0, vy: -12, w: 4, h: 12, dmg: 1, color: '#0ff' });
  } else if (spread === 1) {
    bullets.push({ x: p.x - 10, y: p.y - p.h / 3, vx: 0, vy: -12, w: 4, h: 12, dmg: 1, color: '#0ff' });
    bullets.push({ x: p.x + 10, y: p.y - p.h / 3, vx: 0, vy: -12, w: 4, h: 12, dmg: 1, color: '#0ff' });
  } else {
    bullets.push({ x: p.x, y: p.y - p.h / 2, vx: 0, vy: -14, w: 5, h: 14, dmg: 2, color: '#ff0' });
    bullets.push({ x: p.x - 12, y: p.y - p.h / 3, vx: -1.5, vy: -12, w: 4, h: 12, dmg: 1, color: '#0ff' });
    bullets.push({ x: p.x + 12, y: p.y - p.h / 3, vx: 1.5, vy: -12, w: 4, h: 12, dmg: 1, color: '#0ff' });
  }
}

function shootMissile() {
  if (player.missiles <= 0) return;
  player.missiles--;
  const enemies = [...enemyList, ...(boss ? [boss] : [])];
  const target = enemies.sort((a, b) => {
    const da = Math.hypot(a.x - player.x, a.y - player.y);
    const db = Math.hypot(b.x - player.x, b.y - player.y);
    return da - db;
  })[0];
  bullets.push({
    x: player.x, y: player.y - 20,
    vx: 0, vy: -5, w: 6, h: 16, dmg: 5,
    missile: true, target: target || null,
    color: '#f80', trail: []
  });
  updateHUD();
}

function updateBullets() {
  bullets = bullets.filter(b => {
    if (b.missile && b.target && b.target.hp > 0) {
      const dx = b.target.x - b.x, dy = b.target.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 2) {
        b.vx += (dx / dist) * 0.8;
        b.vy += (dy / dist) * 0.8;
        const spd = Math.hypot(b.vx, b.vy);
        if (spd > 10) { b.vx = b.vx / spd * 10; b.vy = b.vy / spd * 10; }
      }
    }
    b.x += b.vx; b.y += b.vy;

    if (b.missile) {
      b.trail = b.trail || [];
      b.trail.push({ x: b.x, y: b.y, life: 1 });
      if (b.trail.length > 10) b.trail.shift();
      b.trail.forEach(t => {
        t.life -= 0.1;
        ctx.globalAlpha = t.life * 0.6;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3 * t.life, 0, Math.PI * 2);
        ctx.fillStyle = '#f80';
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      // missile body
      ctx.save();
      ctx.translate(b.x, b.y);
      const angle = Math.atan2(b.vy, b.vx) + Math.PI / 2;
      ctx.rotate(angle);
      ctx.fillStyle = '#f80';
      ctx.fillRect(-3, -8, 6, 16);
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(-3, -2);
      ctx.lineTo(3, -2);
      ctx.fill();
      ctx.restore();
    } else {
      // glow bullet
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
      ctx.shadowBlur = 0;
    }

    return b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20;
  });

  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    ctx.shadowColor = b.color || '#f00';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r || 4, 0, Math.PI * 2);
    ctx.fillStyle = b.color || '#f44';
    ctx.fill();
    ctx.shadowBlur = 0;
    return b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10;
  });
}

// ── Powerups ─────────────────────────────────────────────────────────────────
let powerups = [];
const PU_TYPES = ['health', 'power', 'shield', 'missile', 'score'];
const PU_COLORS = { health: '#f44', power: '#ff0', shield: '#0ff', missile: '#f80', score: '#0f0' };
const PU_LABELS = { health: '♥', power: '⚡', shield: '◎', missile: '↑', score: '★' };

function spawnPowerup(x, y) {
  if (Math.random() > 0.35) return;
  const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
  powerups.push({ x, y, vy: 1.5, type, r: 14, spin: 0 });
}

function updatePowerups() {
  powerups = powerups.filter(pu => {
    pu.y += pu.vy;
    pu.spin += 0.05;
    const c = PU_COLORS[pu.type];

    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(pu.spin);
    // glow ring
    ctx.beginPath();
    ctx.arc(0, 0, pu.r, 0, Math.PI * 2);
    ctx.fillStyle = c + '33';
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.shadowColor = c;
    ctx.shadowBlur = 10;
    ctx.stroke();
    // label
    ctx.rotate(-pu.spin);
    ctx.font = `bold 14px Courier New`;
    ctx.fillStyle = c;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_LABELS[pu.type], 0, 1);
    ctx.restore();

    // collect
    if (Math.hypot(pu.x - player.x, pu.y - player.y) < pu.r + 20) {
      applyPowerup(pu.type);
      spawnParticles(pu.x, pu.y, 15, c, 4);
      return false;
    }
    return pu.y < H + 30;
  });
}

function applyPowerup(type) {
  switch (type) {
    case 'health':
      player.hp = Math.min(player.maxHp, player.hp + 1);
      updateHUD(); break;
    case 'power':
      player.powerLevel = Math.min(2, player.powerLevel + 1);
      player.powerTimer = 600; break;
    case 'shield':
      player.shield = true;
      player.shieldTimer = 300; break;
    case 'missile':
      player.missiles = Math.min(player.maxMissiles, player.missiles + 2);
      updateHUD(); break;
    case 'score':
      score += 500 * level;
      updateHUD(); break;
  }
}

// ── Enemies ──────────────────────────────────────────────────────────────────
let enemyList = [];
let enemySpawnTimer = 0;
let boss = null;
let bossPhase = 0;

const ENEMY_TYPES = {
  scout: { w: 30, h: 28, hp: 1, speed: 2, score: 100, color: '#f44', shootRate: 0 },
  fighter: { w: 36, h: 34, hp: 2, speed: 1.5, score: 200, color: '#f84', shootRate: 120 },
  heavy: { w: 44, h: 40, hp: 5, speed: 0.8, score: 400, color: '#f0a', shootRate: 80 },
  zigzag: { w: 28, h: 26, hp: 1, speed: 2.5, score: 150, color: '#aaf', shootRate: 0 }
};

function spawnEnemy() {
  const keys = Object.keys(ENEMY_TYPES);
  const available = level >= 3
    ? keys
    : level >= 2
    ? keys.filter(k => k !== 'heavy')
    : ['scout', 'zigzag'];
  const type = available[Math.floor(Math.random() * available.length)];
  const tmpl = ENEMY_TYPES[type];
  const x = Math.random() * (W - tmpl.w * 2) + tmpl.w;

  let vy = tmpl.speed;
  let vx = 0;
  if (type === 'zigzag') vx = (Math.random() > 0.5 ? 1 : -1) * 2;
  if (type === 'fighter' || type === 'heavy') vx = (Math.random() - 0.5) * 1;

  enemyList.push({
    x, y: -50, vx, vy,
    ...tmpl, type,
    shootCd: Math.random() * 60,
    hp: tmpl.hp,
    maxHp: tmpl.hp,
    flash: 0
  });
}

function spawnBoss() {
  boss = {
    x: W / 2, y: -80, vx: 2, vy: 0.5,
    w: 90, h: 70,
    hp: 80 + level * 20, maxHp: 80 + level * 20,
    phase: 0, phaseTimer: 0,
    shootCd: 0,
    flash: 0,
    pattern: 0, patternTimer: 0,
    minY: 80, reached: false
  };
  bossBarEl.style.display = 'block';
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const flashAlpha = e.flash > 0 ? 1 : 0;
  e.flash = Math.max(0, e.flash - 1);

  // hull
  ctx.shadowColor = e.color;
  ctx.shadowBlur = flashAlpha > 0 ? 20 : 6;

  if (e.type === 'scout') {
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(-e.w / 2, -e.h / 2);
    ctx.lineTo(0, -e.h / 4);
    ctx.lineTo(e.w / 2, -e.h / 2);
    ctx.closePath();
    ctx.fillStyle = flashAlpha > 0 ? '#fff' : e.color;
    ctx.fill();
  } else if (e.type === 'fighter') {
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(-e.w / 2, e.h / 4);
    ctx.lineTo(-e.w / 3, -e.h / 2);
    ctx.lineTo(0, -e.h / 3);
    ctx.lineTo(e.w / 3, -e.h / 2);
    ctx.lineTo(e.w / 2, e.h / 4);
    ctx.closePath();
    ctx.fillStyle = flashAlpha > 0 ? '#fff' : e.color;
    ctx.fill();
  } else if (e.type === 'heavy') {
    ctx.beginPath();
    ctx.roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 8);
    ctx.fillStyle = flashAlpha > 0 ? '#fff' : e.color;
    ctx.fill();
    ctx.strokeStyle = '#fff4';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else { // zigzag
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(-e.w / 2, 0);
    ctx.lineTo(-e.w / 4, -e.h / 2);
    ctx.lineTo(e.w / 4, -e.h / 2);
    ctx.lineTo(e.w / 2, 0);
    ctx.closePath();
    ctx.fillStyle = flashAlpha > 0 ? '#fff' : e.color;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // HP bar (only for heavy)
  if (e.type === 'heavy' && e.hp < e.maxHp) {
    const bw = e.w, bh = 4;
    ctx.fillStyle = '#333';
    ctx.fillRect(-bw / 2, e.h / 2 + 4, bw, bh);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(-bw / 2, e.h / 2 + 4, bw * (e.hp / e.maxHp), bh);
  }

  ctx.restore();
}

function drawBoss() {
  if (!boss) return;
  ctx.save();
  ctx.translate(boss.x, boss.y);

  const t = frameCount * 0.05;
  boss.flash = Math.max(0, boss.flash - 1);
  const fl = boss.flash > 0;

  ctx.shadowColor = '#f0a';
  ctx.shadowBlur = fl ? 40 : 20;

  // main body
  ctx.beginPath();
  ctx.moveTo(0, -boss.h / 2);
  ctx.lineTo(-boss.w / 2, -boss.h / 4);
  ctx.lineTo(-boss.w * 0.6, boss.h / 4);
  ctx.lineTo(-boss.w / 3, boss.h / 2);
  ctx.lineTo(boss.w / 3, boss.h / 2);
  ctx.lineTo(boss.w * 0.6, boss.h / 4);
  ctx.lineTo(boss.w / 2, -boss.h / 4);
  ctx.closePath();
  ctx.fillStyle = fl ? '#fff' : `hsl(${300 + Math.sin(t) * 30}, 80%, 40%)`;
  ctx.fill();
  ctx.strokeStyle = '#f0a';
  ctx.lineWidth = 2;
  ctx.stroke();

  // core
  ctx.beginPath();
  ctx.arc(0, 0, 16 + Math.sin(t * 2) * 4, 0, Math.PI * 2);
  ctx.fillStyle = fl ? '#fff' : `rgba(255,0,200,${0.6 + Math.sin(t * 3) * 0.3})`;
  ctx.fill();

  // eyes
  [-20, 20].forEach(ex => {
    ctx.beginPath();
    ctx.arc(ex, -10, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex + Math.cos(t) * 2, -10 + Math.sin(t) * 2, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f00';
    ctx.fill();
  });

  ctx.restore();
  ctx.shadowBlur = 0;
}

function updateEnemies() {
  enemyList = enemyList.filter(e => {
    e.x += e.vx; e.y += e.vy;

    // zigzag bounce
    if (e.type === 'zigzag') {
      if (e.x < e.w / 2 || e.x > W - e.w / 2) e.vx *= -1;
    }

    // shooting
    if (e.shootRate > 0) {
      e.shootCd--;
      if (e.shootCd <= 0) {
        e.shootCd = e.shootRate + Math.random() * 40;
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);
        const spd = e.type === 'heavy' ? 4 : 5;
        enemyBullets.push({ x: e.x, y: e.y, vx: dx / dist * spd, vy: dy / dist * spd, r: 4, color: '#f84' });
      }
    }

    drawEnemy(e);

    // check bullet hits
    bullets.forEach(b => {
      if (!b.hit && rectsOverlap(b, e)) {
        e.hp -= b.dmg;
        e.flash = 6;
        b.hit = true;
        spawnParticles(b.x, b.y, 8, '#fff', 2);
      }
    });
    bullets = bullets.filter(b => !b.hit);

    if (e.hp <= 0) {
      score += e.score * level;
      updateHUD();
      spawnParticles(e.x, e.y, 25, e.color, 4);
      spawnPowerup(e.x, e.y);
      return false;
    }

    // hit player
    if (e.y > H - 30) return false;
    if (rectsOverlap({ x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h }, { x: player.x - player.w / 2, y: player.y - player.h / 2, w: player.w, h: player.h })) {
      hurtPlayer(1);
      spawnParticles(e.x, e.y, 20, e.color, 3);
      return false;
    }
    return true;
  });
}

function updateBoss() {
  if (!boss) return;
  const b = boss;

  if (!b.reached) {
    b.y += 1.5;
    if (b.y >= b.minY) { b.reached = true; b.vy = 0; }
  } else {
    b.patternTimer++;
    if (b.patternTimer > 200) { b.pattern = (b.pattern + 1) % 3; b.patternTimer = 0; }

    if (b.pattern === 0) {
      b.x += b.vx;
      if (b.x < b.w / 2 + 10 || b.x > W - b.w / 2 - 10) b.vx *= -1;
    } else if (b.pattern === 1) {
      b.y = b.minY + Math.sin(b.patternTimer * 0.04) * 50;
      b.x += b.vx;
      if (b.x < 80 || b.x > W - 80) b.vx *= -1;
    } else {
      const dx = player.x - b.x, dy = player.y - b.y;
      const dist = Math.hypot(dx, dy);
      b.x += dx / dist * 1.5;
      b.y += dy / dist * 1.5;
      b.y = Math.max(b.minY, Math.min(H / 2, b.y));
    }

    // boss shooting
    b.shootCd--;
    if (b.shootCd <= 0) {
      b.shootCd = Math.max(15, 35 - level * 3);
      const bHpRatio = b.hp / b.maxHp;
      if (bHpRatio > 0.5) {
        // spread shot
        for (let a = -30; a <= 30; a += 15) {
          const rad = (a + 90) * Math.PI / 180;
          enemyBullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(rad) * -6, vy: Math.sin(rad) * -6, r: 5, color: '#f0a' });
        }
      } else {
        // full circle
        for (let a = 0; a < 360; a += 30) {
          const rad = a * Math.PI / 180;
          enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(rad) * 4, vy: Math.sin(rad) * 4, r: 5, color: '#f00' });
        }
      }
    }
  }

  drawBoss();

  // check bullet hits
  bullets.forEach(bl => {
    if (!bl.hit && Math.hypot(bl.x - b.x, bl.y - b.y) < b.w / 2 + 5) {
      b.hp -= bl.dmg;
      b.flash = 5;
      bl.hit = true;
      spawnParticles(bl.x, bl.y, 6, '#fff', 2);
    }
  });
  bullets = bullets.filter(bl => !bl.hit);

  // hp bar
  const ratio = Math.max(0, b.hp / b.maxHp);
  bossBarFill.style.width = (ratio * 100) + '%';

  if (b.hp <= 0) {
    spawnParticles(b.x, b.y, 80, '#f0a', 6);
    spawnParticles(b.x, b.y, 60, '#ff0', 5);
    score += 5000 * level;
    updateHUD();
    boss = null;
    bossBarEl.style.display = 'none';
    setTimeout(() => nextLevel(), 1500);
  }

  // ram player
  if (b.reached && rectsOverlap(
    { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h },
    { x: player.x - player.w / 2, y: player.y - player.h / 2, w: player.w, h: player.h }
  )) hurtPlayer(1);
}

// ── Collision ────────────────────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function checkEnemyBulletHits() {
  if (player.invincible > 0) return;
  enemyBullets = enemyBullets.filter(b => {
    const hit = Math.hypot(b.x - player.x, b.y - player.y) < (b.r + 18);
    if (hit) {
      if (!player.shield) hurtPlayer(1);
      else { spawnParticles(b.x, b.y, 10, '#0ff', 3); }
      return false;
    }
    return true;
  });
}

function hurtPlayer(dmg) {
  if (player.invincible > 0) return;
  if (player.shield) { player.shield = false; player.shieldTimer = 0; return; }
  player.hp -= dmg;
  player.invincible = 90;
  spawnParticles(player.x, player.y, 30, '#f44', 3);
  updateHUD();
  if (player.hp <= 0) endGame();
}

// ── Level System ─────────────────────────────────────────────────────────────
let bossLevel = false;
let enemiesKilledInLevel = 0;
let enemiesForBoss = 15;

function nextLevel() {
  level++;
  bossLevel = false;
  enemiesKilledInLevel = 0;
  enemiesForBoss = 15 + level * 5;
  player.missiles = player.maxMissiles;
  updateHUD();
  // flash level up message
  showMessage(`LEVEL ${level}!`, '#ff0', 2000);
}

let messages = [];
function showMessage(text, color, duration) {
  messages.push({ text, color, life: duration / 16, maxLife: duration / 16, y: H / 2 });
}
function drawMessages() {
  messages = messages.filter(m => {
    m.life--;
    m.y -= 0.5;
    const alpha = Math.min(1, m.life / 30);
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 32px Courier New';
    ctx.fillStyle = m.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 15;
    ctx.fillText(m.text, W / 2, m.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    return m.life > 0;
  });
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  let html = '';
  for (let i = 0; i < player.maxHp; i++) {
    html += `<span class="heart" style="opacity:${i < player.hp ? 1 : 0.2}">❤</span>`;
  }
  html += ` &nbsp; `;
  for (let i = 0; i < player.maxMissiles; i++) {
    html += `<span style="font-size:12px;opacity:${i < player.missiles ? 1 : 0.2}">🚀</span>`;
  }
  healthBar.innerHTML = html;
  scoreDisplay.textContent = `SCORE: ${score.toLocaleString()}`;
  levelDisplay.textContent = bossLevel ? '⚠ BOSS' : `LEVEL ${level}`;
}

// ── Game Loop ────────────────────────────────────────────────────────────────
function update() {
  if (state !== GS.PLAYING) return;
  frameCount++;

  // Player movement
  const p = player;
  if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && p.x > p.w / 2 + 5) p.x -= p.speed;
  if ((keys['ArrowRight'] || keys['d'] || keys['D']) && p.x < W - p.w / 2 - 5) p.x += p.speed;
  if ((keys['ArrowUp'] || keys['w'] || keys['W']) && p.y > p.h / 2 + 5) p.y -= p.speed;
  if ((keys['ArrowDown'] || keys['s'] || keys['S']) && p.y < H - p.h / 2 - 5) p.y += p.speed;

  // Shooting
  p.shootCd = Math.max(0, p.shootCd - 1);
  if ((keys[' '] || keys['Space']) && p.shootCd <= 0) {
    shootPlayer();
    p.shootCd = Math.max(6, p.shootRate - level);
  }

  // Missile
  if ((keys['e'] || keys['E']) && !keys._ePrev) shootMissile();
  keys._ePrev = keys['e'] || keys['E'];

  // Timers
  if (p.invincible > 0) p.invincible--;
  if (p.shield) { p.shieldTimer--; if (p.shieldTimer <= 0) p.shield = false; }
  if (p.powerLevel > 0) { p.powerTimer--; if (p.powerTimer <= 0) { p.powerLevel = 0; } }

  // Enemy spawning
  if (!bossLevel) {
    enemySpawnTimer--;
    const spawnInterval = Math.max(25, 80 - level * 8);
    if (enemySpawnTimer <= 0) {
      spawnEnemy();
      enemySpawnTimer = spawnInterval + Math.random() * 20;
      enemiesKilledInLevel++;
      if (enemiesKilledInLevel >= enemiesForBoss) {
        bossLevel = true;
        enemyList = [];
        spawnBoss();
        updateHUD();
        showMessage('⚠ BOSS APPEARS! ⚠', '#f0a', 3000);
      }
    }
  }
}

function render() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  drawStars();
  updateParticles();
  updateBullets();
  updatePowerups();

  if (!bossLevel) updateEnemies();
  else updateBoss();

  checkEnemyBulletHits();
  drawPlayer();
  drawMessages();
}

function gameLoop() {
  update();
  render();
  animId = requestAnimationFrame(gameLoop);
}

// ── Start / End ──────────────────────────────────────────────────────────────
function startGame() {
  score = 0; level = 1; frameCount = 0;
  bossLevel = false; enemiesKilledInLevel = 0; enemiesForBoss = 15;
  player.x = W / 2; player.y = H - 100;
  player.hp = 3; player.missiles = 3;
  player.invincible = 0; player.shield = false;
  player.powerLevel = 0; player.trail = [];
  player.shootCd = 0;
  bullets = []; enemyBullets = []; enemyList = []; powerups = []; particles = []; messages = [];
  boss = null; bossBarEl.style.display = 'none';
  enemySpawnTimer = 60;
  overlay.style.display = 'none';
  state = GS.PLAYING;
  updateHUD();
  if (animId) cancelAnimationFrame(animId);
  gameLoop();
}

function endGame() {
  state = GS.GAMEOVER;
  cancelAnimationFrame(animId);
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div id="gameOverTitle">GAME OVER</div>
    <div id="finalScore">ĐIỂM SỐ: ${score.toLocaleString()}</div>
    <div class="subtitle">LEVEL ĐẠT ĐƯỢC: ${level}</div>
    <br>
    <button id="startBtn" onclick="startGame()">[ CHƠI LẠI ]</button>
  `;
}

startBtn.addEventListener('click', startGame);

// draw idle stars while on menu
(function menuLoop() {
  if (state !== GS.MENU) return;
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  requestAnimationFrame(menuLoop);
})();
</script>
</body>
</html>
